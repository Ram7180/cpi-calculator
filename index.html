<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחשבון הצמדה למדד המחירים לצרכן</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root {
  --bg:#f0f2f5; --surface:#fff; --surface-alt:#f8f9fb;
  --primary:#1a3a6c; --primary-light:#2550a0;
  --accent:#c8860a; --accent-light:#f0a830;
  --text:#1c2432; --text-muted:#6b7a99; --border:#dde2ed;
  --success:#1a7a4a; --success-bg:#e8f7f0;
  --warning:#c8600a; --warning-bg:#fff4e5;
  --danger:#a01a2a; --danger-bg:#fce8ea;
  --info:#1a5a8a; --info-bg:#e5f0fa;
  --shadow-md:0 4px 16px rgba(26,58,108,.10);
  --shadow-lg:0 8px 32px rgba(26,58,108,.14);
  --radius:12px; --radius-sm:7px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:28px 40px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hdr-title{font-size:26px;font-weight:800}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:20px;margin-bottom:24px}
.btn{padding:10px 20px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;transition:0.2s}
.btn-primary{background:var(--primary);color:#fff}
.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input, select { padding: 8px; border: 1px solid var(--border); border-radius: 4px; width: 100%; margin-top: 5px; }
.manual-panel { border: 1px solid var(--border); border-radius: 8px; margin-top: 20px; }
.mp-hdr { padding: 10px; background: var(--surface-alt); cursor: pointer; font-weight: bold; }
.mp-body { display: none; padding: 15px; }
.mp-body.open { display: block; }
</style>
</head>
<body>
<header>
  <div class="hdr-left">
    <div class="hdr-title">מחשבון הצמדה למדד</div>
    <div class="hdr-sub">נתונים רשמיים מהלמ"ס</div>
  </div>
  <div class="hdr-right">
    <button id="btnFetchCbs" class="btn btn-hdr" onclick="fetchLatestCbs()">
      <span id="fetchCbsIcon">🔍</span> <span id="fetchCbsStatus">טען מדד אחרון</span>
    </button>
  </div>
</header>

<main>
  <div class="card">
    <label>סכום לחישוב (₪):</label>
    <input type="number" id="mainAmount" placeholder="הזן סכום...">
    <br><br>
    <button class="btn btn-primary" onclick="calculateSimple()">חשב הצמדה</button>
    <div id="simpleResult" style="margin-top:20px; font-weight:bold; font-size:1.2em; color:var(--primary)"></div>
  </div>

  <div class="manual-panel">
    <div class="mp-hdr" onclick="toggleMP()">הזנה ידנית / הגדרות נוספות <span id="mpChev">▼</span></div>
    <div id="mpBody" class="mp-body">
      <div id="manualRows"></div>
      <button class="btn" onclick="addManualRow()">+ הוסף שורה</button>
    </div>
  </div>
</main>

<script>
/* חלק 1 של ה-Script */
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function toggleMP() {
  const body = document.getElementById('mpBody');
  const chev = document.getElementById('mpChev');
  body.classList.toggle('open');
  chev.style.transform = body.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
}

async function fetchLatestCbs() {
  const btn = document.getElementById('btnFetchCbs');
  const status = document.getElementById('fetchCbsStatus');
  const icon = document.getElementById('fetchCbsIcon');
  
  btn.disabled = true;
  icon.className = 'spin'; icon.textContent = '↺';
  status.textContent = 'מתחבר ללמ"ס...';

  try {
    const targetUrl = 'https://cbs.gov.il';
    const response = await fetch(`https://allorigins.win{encodeURIComponent(targetUrl)}`);
    const wrapper = await response.json();
    const data = JSON.parse(wrapper.contents);
    
    const latest = data.monthly_data;
    status.textContent = `מדד ${latest.month}/${latest.year} עודכן!`;
    status.style.color = 'green';
    // כאן תוכל להוסיף השמה למשתנים שלך
  } catch (e) {
    status.textContent = 'הלמ"ס לא הגיב - הזן ידנית';
    status.style.color = 'red';
  } finally {
    btn.disabled = false;
    icon.className = ''; icon.textContent = '🔍';
  }
}
function calculateSimple() {
  const amt = document.getElementById('mainAmount').value;
  if(!amt) { alert('נא להזין סכום'); return; }
  document.getElementById('simpleResult').textContent = 'הסכום המוצמד: ' + (amt * 1.05).toFixed(2) + ' ₪ (לדוגמה)';
}

let manualRowCount = 0;
function addManualRow() {
  const container = document.getElementById('manualRows');
  const div = document.createElement('div');
  div.innerHTML = `<input type="text" placeholder="תיאור"> <input type="number" placeholder="ערך">`;
  container.appendChild(div);
}
</script>
</body>
</html>
